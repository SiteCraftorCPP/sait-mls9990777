# jushvili.site — прокси на Python-сервер с оплатой (порт 8090)
# cp deploy/nginx-jushvili.site.conf /etc/nginx/sites-available/jushvili.site
# nginx -t && systemctl reload nginx

server {
    server_name jushvili.site www.jushvili.site;

    client_max_body_size 2m;
    charset utf-8;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/jushvili.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jushvili.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.jushvili.site) {
        return 301 https://$host$request_uri;
    }

    if ($host = jushvili.site) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name jushvili.site www.jushvili.site;
    return 404;
}
